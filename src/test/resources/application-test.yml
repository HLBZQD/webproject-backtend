spring:
  datasource:
    url: jdbc:h2:mem:wordtype_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: TestSecretKeyForJWT2026MustBeLongEnoughToPass256BitRequirement
  expiration: 86400000

logging:
  level:
    com.hlb.webproject_wp: DEBUG
